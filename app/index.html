<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0F766E" />
    <title>Cockpit</title>
    <!-- Appli installable (29 sept. 2026) : manifeste + icônes dans public/. -->
    <link rel="manifest" href="/Cockpit-General/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/Cockpit-General/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cockpit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle'%3E%F0%9F%9B%A9%3C/text%3E%3C/svg%3E" />
    <script>
      // Appliquer le thème AVANT le premier rendu pour éviter un flash.
      try {
        var t = localStorage.getItem('cockpit_theme');
        var sombre = t === 'sombre' || (t !== 'clair' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (sombre) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
