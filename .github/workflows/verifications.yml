# Contrôles hors ligne sur toutes les branches : typecheck de l'app, scripts
# purs, syntaxe des scripts shell. Seul retour d'une session avant de merger.
name: Vérifications
on:
  push:
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash -n scripts/*.sh hooks/*.sh
      # Réglages illisibles = Claude Code ignore TOUS les hooks du projet (30 sept. 2026).
      - name: .claude/settings.json est du JSON valide
        run: for f in .claude/settings*.json; do [ -f "$f" ] && python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f"; done
      - working-directory: app
        run: |
          npm ci
          npx tsc -b
          for f in scripts/verifier-*.ts; do [ -f "$f" ] && node --experimental-strip-types "$f"; done
          npm run build
