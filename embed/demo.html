<!doctype html>

<title>Démo — module embarqué du Cockpit</title>
<!--
  Page hôte minimaliste pour essayer le module embarqué.

  Son style est VOLONTAIREMENT agressif (tout en serif rouge, en capitales,
  espacé) : c'est la preuve que le Shadow DOM isole le module — seule la
  police de caractères est héritée, rien d'autre ne traverse.

  La clé data-cle est celle du projet pilote « cockpit ». Elle est publique
  par nature (elle vit dans la page de n'importe quel site hôte) : elle ne
  donne aucun droit sur la base, seulement le droit de parler à la fonction
  serveur pour CE projet, et elle se révoque en la régénérant.
-->
<style>
  * { font-family: Georgia, serif; color: red; text-transform: uppercase; letter-spacing: 3px; font-size: 22px; }
  body { margin: 0; padding: 16px; background: #fffbe6; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 26px; }
  .cockpit-embed { text-transform: none; letter-spacing: normal; }
</style>
</head>
<body>
<main>
  <h1>Mon site (style hostile)</h1>
  <p>Tout ce qui est en rouge et en capitales vient de la page hôte. Le module du Cockpit, juste en dessous, garde son propre style.</p>

  <script src="./cockpit-embed.js"
          data-cle="fac00c119a3d4f1fadeebf929cd2a4c01f168aa15d4b423ea9b8edf7e547aeee"
          data-utilisateur="Démo"
          data-titre="Demandes et corrections"></script>

  <p>Et ce paragraphe, après le module, est encore en rouge : rien n'a fui dans l'autre sens non plus.</p>
</main>
</body>
</html>
